spring.application.name=spring_rest
spring.datasource.url=jdbc:oracle:thin:@${DB_HOST:oracle_container}:${DB_PORT:1521}/${DB_SERVICE:FREEPDB1}
spring.datasource.username=${DB_USER:system}
spring.datasource.password=${DB_PASS:@HardworkingLaurde7}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# Reduce logging level. Only warn is displayed
logging.level.root=warn

# Turn of Spring Boot Banner
spring.main.banner-mode=off

# Add logging configs to display SQL statements
logging.level.org.hibernate.SQL=debug
logging.level.org.hibernate.orm.jdbc.bind=trace

# Configure JPA/Hibernate to auto create the tables
spring.jpa.hibernate.ddl-auto=update